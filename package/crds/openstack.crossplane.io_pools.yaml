                - Orphan
                - Delete
                type: string
              forProvider:
                description: PoolParameters define the desired state of an OpenStack
                  Octavia pool.
                properties:
                  adminStateUp:
                    default: true
                    description: AdminStateUp is the administrative state of the pool
                      (true = UP).
                    type: boolean
                  description:
                    description: Description of the pool.
                    type: string
                  lbMethod:
                    description: LBMethod is the load balancing algorithm (ROUND_ROBIN,
                      LEAST_CONNECTIONS, SOURCE_IP, SOURCE_IP_PORT).
                    enum:
                    - ROUND_ROBIN
                    - LEAST_CONNECTIONS
                    - SOURCE_IP
                    - SOURCE_IP_PORT
                    type: string
                  listenerId:
                    description: ListenerID is the UUID of the listener. One of LoadbalancerID
                      or ListenerID must be provided.
                    type: string
                  loadbalancerId:
                    description: LoadbalancerID is the UUID of the load balancer.
                      One of LoadbalancerID or ListenerID must be provided.
                    type: string
                  name:
                    description: Name is the human-readable name for the pool.
                    type: string
                  persistence:
                    description: Persistence is the session persistence configuration.
                    properties:
                      cookieName:
                        description: CookieName is the cookie name for APP_COOKIE
                          persistence.
                        type: string
                      type:
                        description: Type is the persistence mode (SOURCE_IP, HTTP_COOKIE,
                          APP_COOKIE).
                        enum:
                        - SOURCE_IP
                        - HTTP_COOKIE
                        - APP_COOKIE
                        type: string
                    type: object
                  projectId:
                    description: ProjectID is the UUID of the project who owns the
                      pool.
                    type: string
                  protocol:
                    description: Protocol is the protocol of the pool (TCP, UDP, HTTP,
                      HTTPS).
                    type: string
                  tags:
                    description: Tags is a set of resource tags.
                    items:
                      type: string
                    type: array
                required:
