            properties:
              atProvider:
                description: PoolProviderStatus defines the observed state of the
                  pool at the provider.
                properties:
                  adminStateUp:
                    description: AdminStateUp is the administrative state.
                    type: boolean
                  createdAt:
                    description: CreatedAt is the creation timestamp.
                    type: string
                  description:
                    description: Description of the pool.
                    type: string
                  lbMethod:
                    description: LBMethod is the load balancing algorithm.
                    type: string
                  monitorId:
                    description: MonitorID is the associated health monitor ID.
                    type: string
                  name:
                    description: Name is the human-readable name of the pool.
                    type: string
                  operatingStatus:
                    description: OperatingStatus is the operating status.
                    type: string
                  poolId:
                    description: PoolID is the unique identifier of the pool in OpenStack.
                    type: string
                  projectId:
                    description: ProjectID is the project owner.
                    type: string
                  protocol:
                    description: Protocol is the pool protocol.
                    type: string
                  provisioningStatus:
                    description: ProvisioningStatus is the provisioning status.
                    type: string
                  tags:
                    description: Tags on the pool.
                    items:
                      type: string
                    type: array
                  updatedAt:
                    description: UpdatedAt is the last update timestamp.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
