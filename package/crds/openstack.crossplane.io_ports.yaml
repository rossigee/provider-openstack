      type: string
    - jsonPath: .status.atProvider.status
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Port is a managed resource that represents an OpenStack Neutron
          port.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PortSpec defines the desired state of a Port.
            properties:
              deletionPolicy:
                default: Delete
                description: |-
                  DeletionPolicy specifies what will happen to the underlying external
                  when this managed resource is deleted - either "Delete" or "Orphan" the
                  external resource.
                  This field is planned to be deprecated in favor of the ManagementPolicies
                  field in a future release. Currently, both could be set independently and
                  non-default values would be honored if the feature flag is enabled.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                enum:
                - Orphan
                - Delete
                type: string
              forProvider:
                description: PortParameters define the desired state of an OpenStack
                  Neutron port.
                properties:
                  adminStateUp:
                    default: true
                    description: AdminStateUp is the administrative state of the port
                      (true = up).
                    type: boolean
                  allowedAddressPairs:
                    description: AllowedAddressPairs identifies the list of IP/MAC
                      addresses the port will recognize/accept.
                    items:
                      description: AddressPair defines an allowed address pair on
                        a port.
                      properties:
                        ipAddress:
                          description: IPAddress is the IP address for the allowed
                            address pair.
                          type: string
                        macAddress:
                          description: MACAddress is the MAC address for the allowed
                            address pair.
                          type: string
                      type: object
                    type: array
                  description:
                    description: Description of the port.
                    type: string
                  deviceId:
                    description: DeviceID identifies the device (e.g., virtual server)
                      using this port.
                    type: string
                  deviceOwner:
                    description: 'DeviceOwner identifies the entity (e.g.: dhcp agent)
                      using this port.'
                    type: string
                  fixedIPs:
                    description: FixedIPs specifies the IP addresses for the port.
                    items:
                      description: FixedIP defines a fixed IP address allocation on
                        a port.
                      properties:
                        ipAddress:
                          description: IPAddress is the specific IP address to allocate.
                          type: string
                        subnetId:
                          description: SubnetID is the ID of the subnet from which
                            the IP address is allocated.
                          type: string
                      type: object
                    type: array
                  macAddress:
                    description: MACAddress is the MAC address to use on this port.
                    type: string
                  name:
                    description: Name is the human-readable name for the port.
                    type: string
                  networkId:
                    description: NetworkID is the ID of the network to which the port
                      belongs.
                    type: string
                  securityGroups:
                    description: SecurityGroups is the list of security group IDs
                      associated with the port.
                    items:
                      type: string
                    type: array
                  tenantId:
                    description: TenantID is the project owner of the port.
                    type: string
                required:
                - networkId
                type: object
              managementPolicies:
                default:
                - '*'
                description: |-
                  THIS IS A BETA FIELD. It is on by default but can be opted out
                  through a Crossplane feature flag.
                  ManagementPolicies specify the array of actions Crossplane is allowed to
                  take on the managed and external resources.
                  This field is planned to replace the DeletionPolicy field in a future
                  release. Currently, both could be set independently and non-default
                  values would be honored if the feature flag is enabled. If both are
                  custom, the DeletionPolicy field will be ignored.
                  See the design doc for more information: https://github.com/crossplane/crossplane/blob/499895a25d1a1a0ba1604944ef98ac7a1a71f197/design/design-doc-observe-only-resources.md?plain=1#L223
                  and this one: https://github.com/crossplane/crossplane/blob/444267e84783136daa93568b364a5f01228cacbe/design/one-pager-ignore-changes.md
                items:
                  description: |-
                    A ManagementAction represents an action that the Crossplane controllers
                    can take on an external resource.
                  enum:
                  - Observe
                  - Create
                  - Update
                  - Delete
                  - LateInitialize
                  - '*'
                  type: string
                type: array
              providerConfigRef:
                default:
                  name: default
                description: |-
                  ProviderConfigReference specifies how the provider that will be used to
                  create, observe, update, and delete this managed resource should be
                  configured.
                properties:
                  name:
                    description: Name of the referenced object.
                    type: string
                  policy:
                    description: Policies for referencing.
                    properties:
                      resolution:
                        default: Required
                        description: |-
                          Resolution specifies whether resolution of this reference is required.
                          The default is 'Required', which means the reconcile will fail if the
                          reference cannot be resolved. 'Optional' means this reference will be
                          a no-op if it cannot be resolved.
                        enum:
                        - Required
                        - Optional
                        type: string
                      resolve:
                        description: |-
                          Resolve specifies when this reference should be resolved. The default
                          is 'IfNotPresent', which will attempt to resolve the reference only when
                          the corresponding field is not present. Use 'Always' to resolve the
                          reference on every reconcile.
                        enum:
                        - Always
                        - IfNotPresent
                        type: string
                    type: object
                required:
                - name
                type: object
              writeConnectionSecretToRef:
                description: |-
                  WriteConnectionSecretToReference specifies the namespace and name of a
                  Secret to which any connection details for this managed resource should
                  be written. Connection details frequently include the endpoint, username,
                  and password required to connect to the managed resource.
                properties:
                  name:
                    description: Name of the secret.
                    type: string
                  namespace:
                    description: Namespace of the secret.
                    type: string
                required:
                - name
                - namespace
                type: object
            type: object
          status:
            description: PortStatus defines the observed state of an OpenStack port.
            properties:
              atProvider:
                description: PortProviderStatus defines the observed state of the
                  port at the provider.
                properties:
                  adminStateUp:
                    description: AdminStateUp is the administrative state.
                    type: boolean
                  allowedAddressPairs:
                    description: AllowedAddressPairs are the allowed address pairs.
                    items:
                      description: AddressPair defines an allowed address pair on
                        a port.
                      properties:
                        ipAddress:
                          description: IPAddress is the IP address for the allowed
                            address pair.
                          type: string
                        macAddress:
                          description: MACAddress is the MAC address for the allowed
                            address pair.
                          type: string
                      type: object
                    type: array
                  description:
                    description: Description of the port.
                    type: string
                  deviceId:
                    description: DeviceID identifies the device using this port.
                    type: string
                  deviceOwner:
                    description: DeviceOwner identifies the entity using this port.
                    type: string
                  fixedIPs:
                    description: FixedIPs are the fixed IPs allocated to the port.
                    items:
                      description: FixedIP defines a fixed IP address allocation on
                        a port.
                      properties:
                        ipAddress:
                          description: IPAddress is the specific IP address to allocate.
                          type: string
                        subnetId:
                          description: SubnetID is the ID of the subnet from which
                            the IP address is allocated.
                          type: string
                      type: object
                    type: array
                  macAddress:
                    description: MACAddress is the MAC address of the port.
                    type: string
                  name:
                    description: Name is the name of the port.
                    type: string
                  networkId:
                    description: NetworkID is the network this port belongs to.
                    type: string
                  portId:
                    description: PortID is the unique identifier of the port in OpenStack.
                    type: string
                  securityGroups:
                    description: SecurityGroups is the list of security group IDs.
                    items:
                      type: string
                    type: array
                  status:
                    description: Status is the current status (ACTIVE, DOWN, BUILD,
                      ERROR).
                    type: string
                  tenantId:
                    description: TenantID is the project owner.
                    type: string
                type: object
              conditions:
                description: Conditions of the resource.
                items:
                  description: A Condition that may apply to a resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        LastTransitionTime is the last time this condition transitioned from one
                        status to another.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        A Message containing details about this condition's last transition from
                        one status to another, if any.
                      type: string
                    observedGeneration:
                      description: |-
                        ObservedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: A Reason for this condition's last transition from
                        one status to another.
                      type: string
                    status:
                      description: Status of this condition; is it currently True,
                        False, or Unknown?
                      type: string
                    type:
                      description: |-
                        Type of this condition. At most one of each condition type may apply to
                        a resource at any point in time.
                      type: string
                  required:
                  - lastTransitionTime
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
