version: "2"

run:
  timeout: 5m
  exclude-dirs:
    - apis
    - vendor

linters:
  enable:
    - govet
    - ineffassign
    - misspell
    - unconvert
    - unused
  exclusions:
    paths:
      - apis/v1alpha1/groupversion_info.go
      - apis/v1beta1/groupversion_info.go

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - apis/v1alpha1/groupversion_info.go
      - apis/v1beta1/groupversion_info.go

issues:
  exclusions:
    rules:
      - path: "apis/.*"
        text: "does not implement.*runtime\\.Object"
        source: typecheck
      - path: "vendor/.*"
        source: typecheck
      - text: "wrapperStatusClient"
        source: typecheck
      - text: "could not import.*upjet"
        source: typecheck
      - text: "could not import.*crossplane-runtime"
        source: typecheck
