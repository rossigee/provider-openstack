apiVersion: networking.openstack.m.crossplane.io/v1beta1
kind: RBACPolicy
metadata:
  name: example-rbac-policy
spec:
  forProvider:
    action: access_as_shared
    objectType: network
    objectId: <network-id>
    targetTenant: <tenant-id>
  providerConfigRef:
    name: default
  deletionPolicy: Delete
