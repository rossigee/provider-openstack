apiVersion: networking.openstack.m.crossplane.io/v1beta1
kind: Port
metadata:
  name: example-port
spec:
  forProvider:
    networkId: <network-id>
    name: my-port
    adminStateUp: true
    fixedIPs:
      - subnetId: <subnet-id>
        ipAddress: "10.0.0.10"
  providerConfigRef:
    name: default
  deletionPolicy: Delete
