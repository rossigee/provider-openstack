apiVersion: loadbalancing.openstack.m.crossplane.io/v1beta1
kind: Member
metadata:
  name: example-member
spec:
  forProvider:
    poolId: <pool-id>
    address: "10.0.0.10"
    protocolPort: 80
    name: my-member
    subnetId: <subnet-id>
    weight: 1
    adminStateUp: true
  providerConfigRef:
    name: default
  deletionPolicy: Delete
